<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD3 - Exercice 2 avec AR.js</title>
    <!-- A-Frame + AR.js "location-based" (https://ar-js-org.github.io/AR.js-Docs/location-based/) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #legende { position: absolute; top: 10px; left: 10px; z-index: 10; color: white; font-family: sans-serif;
                   background: rgba(0, 0, 0, 0.5); padding: 8px; }
    </style>
</head>
<body>
    <div id="legende">
        Cubes à ~110 m : <b style="color: red">nord</b>, <b style="color: lime">est</b>,
        <b style="color: blue">sud</b>, <b style="color: yellow">ouest</b>
    </div>

    <!-- AR.js gère tout seul : le flux caméra, le GPS et l'orientation du téléphone -->
    <a-scene vr-mode-ui="enabled: false"
             arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
             renderer="antialias: true; alpha: true">
        <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>

        <!-- un objet géolocalisé "en dur" : Nice (très loin, donc très gros) -->
        <a-box gps-new-entity-place="latitude: 43.7102; longitude: 7.2620"
               scale="500 500 500" material="color: orange"></a-box>
    </a-scene>

    <script>
        //à la première position GPS, on place 4 cubes autour de nous (0.001° ≈ 110 m)
        //pour pouvoir tester n'importe où
        const cubes = [
            { couleur: "red", dLat: 0.001, dLon: 0 },     //nord
            { couleur: "lime", dLat: 0, dLon: 0.001 },    //est
            { couleur: "blue", dLat: -0.001, dLon: 0 },   //sud
            { couleur: "yellow", dLat: 0, dLon: -0.001 }  //ouest
        ];
        let cubesAjoutes = false;

        window.onload = () => {
            document.querySelector("[gps-new-camera]").addEventListener("gps-camera-update-position", (event) => {
                if (cubesAjoutes) return;
                const { latitude, longitude } = event.detail.position;

                cubes.forEach((c) => {
                    const cube = document.createElement("a-box");
                    cube.setAttribute("scale", { x: 20, y: 20, z: 20 });
                    cube.setAttribute("material", { color: c.couleur });
                    cube.setAttribute("gps-new-entity-place", { latitude: latitude + c.dLat, longitude: longitude + c.dLon });
                    document.querySelector("a-scene").appendChild(cube);
                });
                cubesAjoutes = true;
            });
        };
    </script>
</body>
</html>
