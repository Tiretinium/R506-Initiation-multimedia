<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <title>Où suis-je ?</title>
    <style>

        html, body {
            margin: 0;
            height: 100%;
            font-family: system-ui, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([46.6, 2.2], 5); // vue par défaut France pcq ct relou l'angletterre
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Marqueur sur Nice 
        L.marker([43.7102, 7.2620]).addTo(map)
            .bindPopup('Nice');

        // Triangle des Bermudes via de coordonnées que j'ai demandé à l'ia
        var bermudes = [
            [25.7617, -80.1918],
            [32.3078, -64.7505], 
            [18.4655, -66.1057]  
        ];
        L.polygon(bermudes, { color: 'red' }).addTo(map)
            .bindPopup('Triangle des Bermudes');

        var status = document.getElementById('status');

        if (!navigator.geolocation) {
            status.textContent = "La géolocalisation n'est pas prise en charge par votre navigateur.";
        } else {
            navigator.geolocation.getCurrentPosition(
                position => {
                    var latitude = position.coords.latitude;
                    var longitude = position.coords.longitude;
                    map.setView([latitude, longitude], 15);
                    L.marker([latitude, longitude]).addTo(map)
                        .bindPopup('Vous êtes ici !')
                        .openPopup();

                    status.textContent = 'Position trouvée !';
                    setTimeout(() => status.remove(), 2000);
                },
                error => {status.textContent = "Une erreur est survenue.";}
            );
        }
    </script>
</body>
</html>
